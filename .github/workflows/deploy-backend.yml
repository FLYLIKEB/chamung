name: Deploy Backend to Lightsail

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'scripts/deploy-backend-artifact.sh'
      - 'scripts/test-backend-artifact.sh'
  workflow_dispatch: # 수동 실행 가능

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        env:
          NPM_CONFIG_WORKSPACES: "false"
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: |
          echo "📦 npm ci (--no-workspaces) 실행 중..."
          if ! npm ci --legacy-peer-deps --no-workspaces --include-workspace-root=false; then
            echo "❌ npm ci 실패!"
            echo "package-lock.json과 package.json을 동기화한 뒤 다시 실행하세요."
            exit 1
          fi
          
          REQUIRED_PACKAGES=("typeorm" "@nestjs/typeorm" "@nestjs/common" "@nestjs/core" "class-transformer" "class-validator" "rxjs" "mysql2")
          echo "🔍 필수 패키지 확인 중..."
          for pkg in "${REQUIRED_PACKAGES[@]}"; do
            if [ -d "node_modules/$pkg" ]; then
              echo "✅ $pkg 확인됨"
            else
              echo "❌ $pkg 누락됨! package.json을 확인하세요."
              exit 1
            fi
          done

      - name: Build application
        working-directory: ./backend
        run: |
          if [ ! -d "node_modules/typeorm" ]; then
            echo "❌ typeorm 누락! package.json을 확인하세요."
            exit 1
          fi
          npm run build

      - name: Validate deployment activation
        run: bash scripts/test-backend-artifact.sh

      - name: Create deployment package
        working-directory: ./backend
        env:
          NPM_CONFIG_WORKSPACES: "false"
        run: |
          # Build dependencies on the runner, never on the 2 GB production instance.
          npm prune --omit=dev --legacy-peer-deps --no-workspaces --no-audit --no-fund
          node -e 'for (const p of ["typeorm","@nestjs/core","mysql2","sharp","bcrypt"]) require(p)'
          node --input-type=module -e 'import "reflect-metadata"; for (const p of ["adminjs","@adminjs/typeorm","@adminjs/nestjs","@adminjs/express"]) await import(p)'
          mkdir -p deploy-package
          cp -r dist node_modules deploy-package/
          test -f dist/src/database/data-source.js
          test -d dist/migrations
          cp -r dist/migrations deploy-package/migrations
          cp package.json package-lock.json ecosystem.config.js deploy-package/
          printf '%s\n' "$GITHUB_SHA" > deploy-package/RELEASE
          tar -czf deploy.tar.gz -C deploy-package .

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
          EC2_USER: ${{ secrets.EC2_USER || '' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY || '' }}
        run: |
          # 환경 변수 확인
          echo "🔍 환경 변수 확인:"
          echo "EC2_HOST: ${EC2_HOST:+설정됨 (길이: ${#EC2_HOST})}${EC2_HOST:-❌ 설정되지 않음}"
          echo "EC2_USER: ${EC2_USER:+설정됨 (값: '$EC2_USER')}${EC2_USER:-❌ 설정되지 않음}"
          echo "EC2_SSH_KEY: ${EC2_SSH_KEY:+설정됨 (길이: ${#EC2_SSH_KEY})}${EC2_SSH_KEY:-❌ 설정되지 않음}"
          
          # 필수 변수 확인 (빈 문자열도 체크)
          MISSING_SECRETS=()
          if [ -z "${EC2_HOST:-}" ] || [ "$EC2_HOST" = "" ]; then
            MISSING_SECRETS+=("EC2_HOST")
          fi
          if [ -z "${EC2_USER:-}" ] || [ "$EC2_USER" = "" ]; then
            MISSING_SECRETS+=("EC2_USER")
          fi
          if [ -z "${EC2_SSH_KEY:-}" ] || [ "$EC2_SSH_KEY" = "" ]; then
            MISSING_SECRETS+=("EC2_SSH_KEY")
          fi
          
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ 필수 Secrets가 설정되지 않았습니다!"
            echo "누락된 Secrets:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "  - $secret"
            done
            echo ""
            echo "설정 방법:"
            echo "1. GitHub 저장소 → Settings → Secrets and variables → Actions"
            echo "2. New repository secret 클릭"
            echo "3. Name과 Secret 값 입력"
            echo ""
            echo "자세한 내용: docs/GITHUB_SECRETS_CHECKLIST.md"
            exit 1
          fi
          
          echo "✅ 모든 필수 Secrets가 설정되었습니다!"
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # SSH 키 저장 (줄바꿈 보존)
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # SSH 키 형식 확인
          echo "🔑 SSH 키 형식 확인:"
          head -1 ~/.ssh/deploy_key
          tail -1 ~/.ssh/deploy_key
          echo "키 파일 크기: $(wc -c < ~/.ssh/deploy_key) bytes"
          echo "키 파일 줄 수: $(wc -l < ~/.ssh/deploy_key) 줄"
          
          # SSH 키 형식 검증
          if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "❌ SSH 키 형식 오류: 'BEGIN PRIVATE KEY'를 찾을 수 없습니다!"
            echo "EC2_SSH_KEY Secret이 올바른 형식인지 확인하세요."
            exit 1
          fi
          
          if ! grep -q "END.*PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "❌ SSH 키 형식 오류: 'END PRIVATE KEY'를 찾을 수 없습니다!"
            echo "EC2_SSH_KEY Secret이 올바른 형식인지 확인하세요."
            exit 1
          fi
          
          echo "✅ SSH 키 형식 검증 통과"
          
          # DNS 해석 (IPv4/IPv6 구분)
          echo "🔍 DNS 해석:"
          echo "  IPv4: $(getent ahostsv4 "$EC2_HOST" 2>/dev/null | head -1 | awk '{print $1}' || echo '해석 실패')"
          echo "  IPv6: $(getent ahostsv6 "$EC2_HOST" 2>/dev/null | head -1 | awk '{print $1}' || echo '해석 실패/없음')"
          EC2_IPV4=$(getent ahostsv4 "$EC2_HOST" 2>/dev/null | head -1 | awk '{print $1}')
          if [ -z "$EC2_IPV4" ]; then
            EC2_IPV4="$EC2_HOST"
            echo "  (호스트명이 IP이거나 IPv4 해석 실패, $EC2_HOST 사용)"
          fi
          echo ""
          
          # 포트 22 연결 테스트 (IPv4 우선, 타임아웃 15초)
          echo "🔍 포트 22 연결 테스트 중 (IPv4: $EC2_IPV4)..."
          if timeout 15 bash -c "</dev/tcp/$EC2_IPV4/22" 2>/dev/null; then
            echo "✅ 포트 22 열림"
          else
            echo "❌ 포트 22 닫힘 또는 타임아웃"
            echo "⚠️ Lightsail 방화벽에서 SSH(22번 포트)가 GitHub Actions IP에서 접근 가능한지 확인하세요."
            echo "   자세한 내용: docs/SSH_CONNECTION_TIMEOUT_TROUBLESHOOTING.md"
            exit 1
          fi
          echo ""
          
          # Lightsail 호스트 키 추가
          echo "🔐 Lightsail 호스트 키 추가 중..."
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>&1 || true
          chmod 644 ~/.ssh/known_hosts
          
          # SSH 연결 테스트 (실패 시 즉시 종료)
          echo "🔍 SSH 연결 테스트 중..."
          if ! ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              -o BatchMode=yes \
              "$EC2_USER@$EC2_HOST" \
              "echo 'SSH 연결 성공!'" 2>&1; then
            echo ""
            echo "❌ SSH 연결 실패!"
            echo ""
            echo "🔍 문제 진단:"
            echo "1. EC2_SSH_KEY Secret 확인: GitHub 저장소 → Settings → Secrets → EC2_SSH_KEY (Lightsail SSH 키)"
            echo "2. 인스턴스 authorized_keys에 해당 공개 키가 있는지 확인"
            echo "3. Lightsail 사용자명 확인: Ubuntu=ubuntu"
            echo ""
            echo "자세한 내용: docs/deployment/SSH_CONNECTION_TROUBLESHOOTING.md"
            exit 1
          fi
          echo "✅ SSH 연결 테스트 성공!"

      - name: Upload deployment files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # Existing production configuration and user data are not deployment artifacts.
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              backend/deploy.tar.gz scripts/deploy-backend-artifact.sh \
              "$EC2_USER@$EC2_HOST:/tmp/"

      - name: Run deployment on server
        timeout-minutes: 5
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              "$EC2_USER@$EC2_HOST" \
              'bash /tmp/deploy-backend-artifact.sh /tmp/deploy.tar.gz'

      - name: Setup Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "$EC2_USER@$EC2_HOST" << 'ENDSSH'
            set -e

            if ! command -v nginx &> /dev/null; then
              echo "📦 nginx 설치 중..."
              sudo apt-get update -qq
              sudo apt-get install -y nginx
            fi

            {
              echo 'server {'
              echo '    listen 80 default_server;'
              echo '    server_name _;'
              echo ''
              echo '    access_log /var/log/nginx/chalog-backend-access.log;'
              echo '    error_log /var/log/nginx/chalog-backend-error.log;'
              echo ''
              echo '    client_max_body_size 50M;'
              echo ''
              echo '    location / {'
              echo '        proxy_pass http://localhost:3000;'
              echo '        proxy_http_version 1.1;'
              echo "        proxy_set_header Upgrade \$http_upgrade;"
              echo "        proxy_set_header Connection 'upgrade';"
              echo "        proxy_set_header Host \$host;"
              echo "        proxy_set_header X-Real-IP \$remote_addr;"
              echo "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;"
              echo "        proxy_set_header X-Forwarded-Proto \$scheme;"
              echo "        proxy_cache_bypass \$http_upgrade;"
              echo ''
              echo '        proxy_connect_timeout 60s;'
              echo '        proxy_send_timeout 60s;'
              echo '        proxy_read_timeout 60s;'
              echo '    }'
              echo '}'
            } | sudo tee /etc/nginx/sites-available/chalog-backend > /dev/null

            sudo rm -f /etc/nginx/sites-enabled/default
            sudo ln -sf /etc/nginx/sites-available/chalog-backend /etc/nginx/sites-enabled/chalog-backend

            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl reload nginx || sudo systemctl restart nginx
            echo "✅ Nginx 설정 완료"
          ENDSSH

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -rf backend/deploy-package backend/deploy.tar.gz /tmp/deploy_env

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ 배포 완료!"
          echo "🌐 Backend URL: http://${{ secrets.EC2_HOST }}:3000"
          echo "🏥 Health Check: http://${{ secrets.EC2_HOST }}:3000/health"

